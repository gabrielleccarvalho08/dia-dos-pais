<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Chatbot - IA de Manutenções Residenciais 🔨</h2>
        </div>

        <div class="chat-window" id="chatWindow">
            <div class="message bot">
                <span>Olá! Como posso ajudar você hoje? 🛠️✨</span>
            </div>
        </div>

        <div class="chat-input">
            <input
                type="text"
                id="userInput"
                placeholder="Digite sua mensagem e aperte [Enter] ♡"
                autocomplete="off"
                onkeypress="checkEnter(event)">
            <button onclick="sendMessage()" class="send-btn" title="Enviar">✨</button>
        </div>
    </div>
</body>
</html>
